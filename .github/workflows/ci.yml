# Quality gate for every push and pull request (AR-07, AR-21, AR-22).
# Needs no secrets: the build reads env vars lazily, so it succeeds without .env.local.
# Free on public repositories (and within the free minutes on private ones).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install (exact lockfile)
        run: npm ci

      # The build runs first: it generates the Next route types that `tsc` needs.
      - name: Build
        run: npm run build

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # The committed Showcase bundle must match its sources (rebuild with `npm run build:showcase`).
      - name: Showcase bundle is up to date
        run: npm run check:showcase
